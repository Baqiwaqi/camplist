<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">

const Lbl = ({c}) => <div style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--text-muted)',margin:'12px 0 6px'}}>{c}</div>;
function Demo(){
  return <div>
    <AppHeader userName="Sam Rivera" logoSrc="../../assets/logomark.svg" onNavigate={()=>{}} />
    <div style={{padding:'0 16px 16px'}}>
      <Lbl c="Button — primary / accent / secondary / danger / link / sm / disabled" />
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}><Button>Create New</Button><Button variant="accent">Start session</Button><Button variant="secondary">Edit</Button><Button variant="danger">Delete</Button><Button variant="link">Cancel</Button><Button size="sm">Add Item</Button><Button size="sm" variant="secondary">Check</Button><Button disabled>Save</Button></div>

        <ItemRow><span>Tent</span><span style={{color:'var(--text-muted)'}}>Shelter</span><Button size="sm" variant="danger" style={{marginLeft:'auto'}}>Delete</Button></ItemRow>
        <ItemRow last><span>Sleeping bag</span><span style={{color:'var(--text-muted)'}}>Sleep</span><Button size="sm" variant="danger" style={{marginLeft:'auto'}}>Delete</Button></ItemRow>
      </Card>
      <Lbl c="Field — text / multiline / error" />

    </div></div>;
}
