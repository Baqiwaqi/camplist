name: Test and deploy to Azure Container Apps

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camplist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify templates and Go
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          templ generate
          git diff --exit-code -- internal/views
          go test -race ./...
          go vet ./...
          go build ./...
      - name: Verify offline packing
        run: |
          npm ci
          npm run check
          npm test
      - name: Validate infrastructure templates
        run: |
          az bicep build --file infra/foundation.bicep --outfile "$RUNNER_TEMP/foundation.json"
          az bicep build --file infra/app.bicep --outfile "$RUNNER_TEMP/app.json"
      - name: Check container build
        run: docker build --tag camplist-ci .

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.release.outputs.url }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      AZURE_REGISTRY_NAME: ${{ vars.AZURE_REGISTRY_NAME }}
      AZURE_REGISTRY_SERVER: ${{ vars.AZURE_REGISTRY_SERVER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push the commit image
        run: |
          az acr login --name "$AZURE_REGISTRY_NAME"
          image="$AZURE_REGISTRY_SERVER/camplist:$GITHUB_SHA"
          docker build --tag "$image" .
          docker push "$image"
      - name: Deploy and smoke test
        id: release
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          image="$AZURE_REGISTRY_SERVER/camplist:$GITHUB_SHA"
          az containerapp update --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" --image "$image" --only-show-errors --output none
          host=$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$host" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 5 --max-time 30 "https://$host/healthz"
          curl --fail --silent --show-error --retry 6 --retry-all-errors \
            --retry-delay 5 --max-time 30 "https://$host/login" >/dev/null
          echo "Deployed $GITHUB_SHA to https://$host" >> "$GITHUB_STEP_SUMMARY"
