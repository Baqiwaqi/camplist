<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--text-body);background:var(--surface-page)}a{color:var(--text-link)}a:hover{opacity:.7}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:110px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-card)}.lbl{font-size:12px;margin-top:6px}.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-page)"></div><div class="lbl">Page</div><div class="tok">--surface-page</div></div><div class="sw"><div class="chip" style="background:var(--surface-card)"></div><div class="lbl">Card / header</div><div class="tok">--surface-card</div></div><div class="sw"><div class="chip" style="background:var(--sand-100)"></div><div class="lbl">Row divider</div><div class="tok">--sand-100</div></div><div class="sw"><div class="chip" style="background:var(--sand-200)"></div><div class="lbl">Card border</div><div class="tok">--sand-200</div></div><div class="sw"><div class="chip" style="background:var(--sand-300)"></div><div class="lbl">Header border</div><div class="tok">--sand-300</div></div></div></body></html>
