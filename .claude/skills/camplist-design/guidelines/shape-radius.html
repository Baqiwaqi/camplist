<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--text-body);background:var(--surface-page)}a{color:var(--text-link)}a:hover{opacity:.7}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:110px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-card)}.lbl{font-size:12px;margin-top:6px}.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div style="height:64px;background:var(--surface-card);border:1px solid var(--border-card);border-radius:var(--radius-card)"></div><div class="lbl">Card</div><div class="tok">--radius-card 12px</div></div><div class="sw"><div style="height:64px;background:var(--error-bg);border:1px solid var(--error-border);border-radius:var(--radius-sm)"></div><div class="lbl">Error / controls</div><div class="tok">--radius-sm 4px</div></div><div class="sw"><div style="height:64px;display:flex;align-items:center"><span style="background:var(--brand);color:#fff;font-weight:700;padding:8px 20px;border-radius:999px">Create</span></div><div class="lbl">Buttons / tags</div><div class="tok">--radius-pill</div></div></div></body></html>
