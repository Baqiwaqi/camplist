<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--text-body);background:var(--surface-page)}a{color:var(--text-link)}a:hover{opacity:.7}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:110px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-card)}.lbl{font-size:12px;margin-top:6px}.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--error-bg)"></div><div class="lbl">Error bg</div><div class="tok">--error-bg</div></div><div class="sw"><div class="chip" style="background:var(--error-border)"></div><div class="lbl">Error border</div><div class="tok">--error-border</div></div><div class="sw"><div class="chip" style="background:var(--error-text)"></div><div class="lbl">Error text</div><div class="tok">--error-text</div></div><div class="sw" style="flex:2"><div style="display:flex;gap:10px;align-items:flex-start;background:var(--error-text);color:#fff;padding:8px 12px;border-radius:12px;height:56px;box-sizing:border-box;font-size:13px"><span style="width:20px;height:20px;border-radius:50%;background:#fff;color:var(--error-text);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none">!</span><div><b style="font-family:var(--font-display);font-size:15px">Something needs fixing</b><br>Name is required</div></div><div class="lbl">In use</div><div class="tok">.error</div></div></div></body></html>
