<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--text-body);background:var(--surface-page)}a{color:var(--text-link)}a:hover{opacity:.7}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:110px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-card)}.lbl{font-size:12px;margin-top:6px}.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--button-primary-bg)"></div><div class="lbl">Primary bg</div><div class="tok">--button-primary-bg</div></div><div class="sw"><div class="chip" style="background:var(--button-primary-text)"></div><div class="lbl">Primary text</div><div class="tok">--button-primary-text</div></div><div class="sw"><div class="chip" style="background:var(--button-secondary-border)"></div><div class="lbl">Secondary border</div><div class="tok">--button-secondary-border</div></div><div class="sw"><div class="chip" style="background:var(--button-danger-text)"></div><div class="lbl">Danger text</div><div class="tok">--button-danger-text</div></div></div></body></html>
