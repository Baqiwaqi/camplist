<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--text-body);background:var(--surface-page)}a{color:var(--text-link)}a:hover{opacity:.7}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:110px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-card)}.lbl{font-size:12px;margin-top:6px}.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-card);display:flex;align-items:center;padding:0 12px;font-weight:700;color:var(--text-body)">Camping</div><div class="lbl">Body & links</div><div class="tok">--text-body #1f2933</div></div><div class="sw"><div class="chip" style="background:var(--surface-card);display:flex;align-items:center;padding:0 12px;color:var(--text-muted)">Here you can find all you lists</div><div class="lbl">Muted</div><div class="tok">--text-muted #6b645a</div></div><div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="lbl">Ink 900</div><div class="tok">--ink-900</div></div><div class="sw"><div class="chip" style="background:var(--stone-500)"></div><div class="lbl">Stone 500</div><div class="tok">--stone-500</div></div></div></body></html>
