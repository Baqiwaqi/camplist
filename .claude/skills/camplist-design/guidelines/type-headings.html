<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--text-body);background:var(--surface-page)}a{color:var(--text-link)}a:hover{opacity:.7}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:110px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-card)}.lbl{font-size:12px;margin-top:6px}.tok{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><h1 style="margin:0 0 8px;font-family:var(--font-display);font-weight:800;font-size:var(--text-3xl);line-height:1.05;letter-spacing:-0.02em">Where to next? <span class="tok">h1 · 2.75rem · 800</span></h1><h2 style="margin:0 0 8px;font-family:var(--font-display);font-weight:800;font-size:var(--text-xl);line-height:1.05;letter-spacing:-0.02em">Weekend camping <span class="tok">h2 · 1.5rem · 800</span></h2><p style="margin:0;font-size:var(--text-base);line-height:1.5">Start simple and adjust overtime. Keep is simple! <span class="tok">p · 1rem · 400</span></p><p class="muted" style="margin:6px 0 0;color:var(--text-muted)">checked items: 3 / 7 <span class="tok">.muted</span></p></body></html>
