<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Packing on this device · Camplist</title>
 <link rel="stylesheet" href="/static/style.css">
 <script type="module" src="/static/offline/ui.mjs"></script>
</head>
<body class="offline-page">
 <header class="site-header"><nav class="site-nav"><a href="/">Camplist online</a><a href="/offline">On this device</a><a href="/login">Sign in</a></nav></header>
 <main class="container">
  <h1>Packing on this device</h1>
  <p class="muted">Trips you open are saved here automatically. Keep packing without a connection; changes sync automatically when you’re back online.</p>
  <p id="offline-message" role="alert" hidden></p>
  <section id="saved-sessions" aria-label="Sessions saved on this device"></section>
  <section id="offline-trip" class="card" hidden>
   <h2 id="trip-name"></h2><p id="sync-status" role="status"></p>
   <details><summary>Recovery options</summary><button class="btn btn-secondary" id="sync-now">Retry connection</button> <button class="btn btn-secondary" id="export-session">Export this session</button></details>
   <p id="packing-progress" role="status"></p>
   <ul id="offline-items" class="item-list"></ul>
   <a id="review-trip">Review this trip online</a>
  </section>
  <p><button class="btn btn-secondary" id="forget-account">Export and remove this account’s saved copies</button></p>
  <noscript>JavaScript is required for offline packing. Use the online app while connected.</noscript>
 </main>
</body>
</html>
